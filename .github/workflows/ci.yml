name: CI

on:
  push:
    branches: [main]
  pull_request:

# Required status check `ci` for the `protect-main` ruleset. It must not need
# secrets: tests use dummy values from `test-utils/env.ts`.
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run fmt:check

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test
